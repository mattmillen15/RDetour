[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rdrelay"
version = "1.0.0"
description = "RDWeb phishing relay with automatic TSGU tunnel pivot"
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.9",
    "pyspnego>=0.9",
    "cryptography>=41.0",
    "lxml>=4.9",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "aioresponses"]

[project.scripts]
rdrelay = "rdrelay.__main__:main"
tsgu-socks = "rdrelay.tsgu_socks:main"

[tool.setuptools.packages.find]
include = ["rdrelay*"]
